<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe 오토마우스 & 스크롤 매크로</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      background-color: #f4f6f8;
      overflow: hidden;
      user-select: none;
    }

    /* -----------------------------------
       왼쪽 영역: Iframe 및 화면
    ----------------------------------- */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      position: relative;
      min-width: 250px;
    }

    .url-bar-container {
      padding: 10px 14px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #e1e4e8;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 10;
    }

    .url-input {
      flex: 1;
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      outline: none;
    }

    .btn {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      background-color: #0969da;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #0858b9;
    }

    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 드래그 시 iframe 마우스 차단 오버레이 */
    .drag-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: none;
    }
    body.is-dragging .drag-overlay {
      display: block;
    }

    /* 드래그 가능한 클릭 타겟 아이콘 */
    .target-pin {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #cf222e;
      color: white;
      border: 2px solid #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: grab;
      z-index: 10000;
      transform: translate(-50%, -50%);
    }

    .target-pin:active {
      cursor: grabbing;
    }

    .target-pin.active-highlight {
      background-color: #2ea44f;
      box-shadow: 0 0 0 6px rgba(46, 164, 79, 0.4);
    }

    /* -----------------------------------
       경계선 드래그 리사이저 (Resizer)
    ----------------------------------- */
    .resizer {
      width: 8px;
      background-color: #e1e4e8;
      cursor: col-resize;
      transition: background-color 0.2s;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .resizer::after {
      content: "||";
      font-size: 10px;
      color: #8c959f;
    }

    .resizer:hover, body.is-resizing .resizer {
      background-color: #0969da;
    }
    .resizer:hover::after, body.is-resizing .resizer::after {
      color: white;
    }

    /* -----------------------------------
       오른쪽 영역: 조작 패널
    ----------------------------------- */
    .right-panel {
      width: 360px;
      min-width: 260px;
      max-width: 700px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.05);
      overflow-y: auto;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: #24292f;
      border-bottom: 2px solid #f0f2f5;
      padding-bottom: 8px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #57606a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group {
      display: flex;
      gap: 6px;
    }

    .input-field {
      width: 100%;
      padding: 5px 8px;
      font-size: 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 6px;
      background-color: #f8f9fa;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #ffffff;
      padding: 6px 8px;
      border: 1px solid #d0d7de;
      border-radius: 5px;
      font-size: 12px;
    }

    .step-item.executing {
      border-color: #2ea44f;
      background-color: #dafbe1;
    }

    .step-number {
      font-weight: bold;
      color: #0969da;
      width: 16px;
    }

    .step-info {
      flex: 1;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      border: 1px solid #d0d7de;
      background: #f6f8fa;
      cursor: pointer;
    }

    .btn-sm:hover {
      background: #eef1f4;
    }

    .btn-action {
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
    }

    .btn-start { background-color: #2ea44f; }
    .btn-start:hover { background-color: #2c974b; }
    .btn-stop { background-color: #cf222e; }
    .btn-stop:hover { background-color: #a40e26; }

    .log-box {
      font-family: monospace;
      font-size: 11px;
      background-color: #1b1f23;
      color: #00ff66;
      padding: 8px;
      border-radius: 6px;
      height: 90px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .notice-box {
      font-size: 11px;
      color: #6e7781;
      background-color: #fff8c5;
      border: 1px solid rgba(212, 167, 44, 0.4);
      padding: 8px;
      border-radius: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- 왼쪽: URL 및 Iframe 영역 -->
  <div class="left-panel">
    <div class="url-bar-container">
      <input type="text" id="urlInput" class="url-input" placeholder="https://example.com" value="https://example.com">
      <button class="btn" onclick="loadUrl()">이동</button>
    </div>
    <div class="iframe-wrapper" id="iframeWrapper">
      <div class="drag-overlay" id="dragOverlay"></div>
      <iframe id="siteIframe" src="https://example.com"></iframe>
    </div>
  </div>

  <!-- 좌우 경계선 (패널 크기 조절용) -->
  <div class="resizer" id="resizer"></div>

  <!-- 오른쪽: 조작 패널 -->
  <div class="right-panel" id="rightPanel">
    <h2 class="panel-title">매크로 조작 패널</h2>

    <!-- 액션 추가 버튼 -->
    <div class="control-group">
      <div class="section-title">액션 추가</div>
      <button class="btn-sm" style="width:100%; margin-bottom: 4px;" onclick="addClickPin()">🎯 클릭 타겟 아이콘 추가</button>
      
      <div class="input-group">
        <input type="number" id="scrollDistance" class="input-field" value="300" placeholder="스크롤 px">
        <button class="btn-sm" style="flex:1;" onclick="addScrollStep('down')">📜 휠 내리기</button>
        <button class="btn-sm" style="flex:1;" onclick="addScrollStep('up')">📜 휠 올리기</button>
      </div>
    </div>

    <!-- 시나리오 단계 목록 -->
    <div class="control-group">
      <div class="section-title">
        <span>시나리오 순서</span>
        <button class="btn-sm" onclick="clearSteps()">전체 삭제</button>
      </div>
      <div id="stepList" class="step-list"></div>
    </div>

    <!-- 반복 및 대기 설정 -->
    <div class="control-group">
      <div class="section-title">반복 설정</div>
      <div class="input-group">
        <div style="flex:1;">
          <label style="font-size:10px; color:#57606a;">스텝 대기(초)</label>
          <input type="number" id="stepDelay" class="input-field" value="1" min="0.1" step="0.1">
        </div>
        <div style="flex:1;">
          <label style="font-size:10px; color:#57606a;">반복 횟수</label>
          <input type="number" id="loopCount" class="input-field" value="0" min="0" placeholder="0=무한">
        </div>
      </div>
    </div>

    <!-- 제어 버튼 -->
    <div class="input-group">
      <button id="startBtn" class="btn-action btn-start" style="flex:1;" onclick="startScenario()">시나리오 시작</button>
      <button id="stopBtn" class="btn-action btn-stop" style="flex:1;" onclick="stopScenario()" disabled>중지</button>
    </div>

    <!-- 로그 -->
    <div class="control-group">
      <span class="section-title">실행 로그</span>
      <div id="logArea" class="log-box">> 대기 중...</div>
    </div>

    <div class="notice-box">
      💡 <b>팁:</b> 타겟 핀을 잡고 드래그하거나, 가운데 경계선(||)을 잡고 끌면 크기가 자유롭게 조절됩니다.
    </div>
  </div>

  <script>
    let steps = [];           
    let pinCounter = 0;       
    let isRunning = false;     
    let currentLoop = 0;      

    // URL 이동
    function loadUrl() {
      const input = document.getElementById('urlInput');
      let url = input.value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
        input.value = url;
      }
      document.getElementById('siteIframe').src = url;
      addLog(`URL 이동: ${url}`);
    }

    document.getElementById('urlInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadUrl();
    });

    // 클릭 타겟 핀 추가
    function addClickPin() {
      pinCounter++;
      const pinId = 'pin_' + pinCounter;
      const wrapper = document.getElementById('iframeWrapper');

      const pin = document.createElement('div');
      pin.className = 'target-pin';
      pin.id = pinId;
      pin.innerText = pinCounter;
      pin.style.left = '100px';
      pin.style.top = '100px';
      wrapper.appendChild(pin);

      enablePinDrag(pin);

      steps.push({
        id: pinId,
        type: 'click',
        name: `🎯 클릭 (핀 #${pinCounter})`,
        getCoords: () => {
          return {
            x: parseInt(pin.style.left),
            y: parseInt(pin.style.top)
          };
        }
      });

      renderSteps();
      addLog(`핀 #${pinCounter} 생성됨`);
    }

    // 완벽하게 동작하는 핀 드래그 로직 (오버레이 적용)
    function enablePinDrag(element) {
      let isDragging = false;

      element.addEventListener('mousedown', (e) => {
        isDragging = true;
        document.body.classList.add('is-dragging');
        e.stopPropagation();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const wrapper = document.getElementById('iframeWrapper');
        const rect = wrapper.getBoundingClientRect();

        let x = e.clientX - rect.left;
        let y = e.clientY - rect.top;

        x = Math.max(10, Math.min(x, rect.width - 10));
        y = Math.max(10, Math.min(y, rect.height - 10));

        element.style.left = x + 'px';
        element.style.top = y + 'px';
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          document.body.classList.remove('is-dragging');
        }
      });
    }

    // 패널 크기 조절 리사이저 로직
    const resizer = document.getElementById('resizer');
    const rightPanel = document.getElementById('rightPanel');
    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      document.body.classList.add('is-resizing');
      document.body.classList.add('is-dragging'); // iframe 마우스 방해 차단 공유
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const newWidth = window.innerWidth - e.clientX;
      if (newWidth >= 250 && newWidth <= 700) {
        rightPanel.style.width = newWidth + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        document.body.classList.remove('is-resizing');
        document.body.classList.remove('is-dragging');
      }
    });

    // 휠 스크롤 스텝 추가
    function addScrollStep(direction) {
      const distInput = document.getElementById('scrollDistance');
      const distance = parseInt(distInput.value) || 300;
      const name = direction === 'down' ? `📜 휠 내리기 (${distance}px)` : `📜 휠 올리기 (${distance}px)`;
      
      steps.push({
        type: 'scroll',
        direction: direction,
        distance: distance,
        name: name
      });
      renderSteps();
      addLog(`스크롤 추가: ${name}`);
    }

    // 스텝 UI 렌더링
    function renderSteps() {
      const listEl = document.getElementById('stepList');
      listEl.innerHTML = '';

      if (steps.length === 0) {
        listEl.innerHTML = '<div style="font-size:11px; color:#8c959f; text-align:center; padding:8px;">등록된 액션이 없습니다.</div>';
        return;
      }

      steps.forEach((step, idx) => {
        const item = document.createElement('div');
        item.className = 'step-item';
        item.id = `step_ui_${idx}`;
        item.innerHTML = `
          <span class="step-number">${idx + 1}</span>
          <span class="step-info">${step.name}</span>
          <button class="btn-sm" onclick="removeStep(${idx})">삭제</button>
        `;
        listEl.appendChild(item);
      });
    }

    function removeStep(index) {
      const step = steps[index];
      if (step.type === 'click') {
        const pin = document.getElementById(step.id);
        if (pin) pin.remove();
      }
      steps.splice(index, 1);
      renderSteps();
    }

    function clearSteps() {
      document.querySelectorAll('.target-pin').forEach(el => el.remove());
      steps = [];
      renderSteps();
      addLog('전체 스텝 삭제됨');
    }

    // 매크로 실행
    async function startScenario() {
      if (steps.length === 0) {
        alert('액션을 추가해 주세요.');
        return;
      }

      isRunning = true;
      currentLoop = 0;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;

      const loopLimit = parseInt(document.getElementById('loopCount').value) || 0;
      const delaySec = parseFloat(document.getElementById('stepDelay').value) || 1;

      addLog(`▶️ 시나리오 시작`);

      while (isRunning) {
        currentLoop++;
        addLog(`=== [회차 ${currentLoop}] 시작 ===`);

        for (let i = 0; i < steps.length; i++) {
          if (!isRunning) break;

          highlightStepUI(i);
          await executeStep(steps[i]);
          await sleep(delaySec * 1000);
          unhighlightStepUI(i);
        }

        if (loopLimit > 0 && currentLoop >= loopLimit) {
          addLog(`✅ 반복 완료 (${loopLimit}회)`);
          stopScenario();
          break;
        }
      }
    }

    async function executeStep(step) {
      const iframe = document.getElementById('siteIframe');

      try {
        const iframeWin = iframe.contentWindow;
        const iframeDoc = iframe.contentDocument || iframeWin.document;

        if (step.type === 'click') {
          const coords = step.getCoords();
          const pinEl = document.getElementById(step.id);
          if (pinEl) pinEl.classList.add('active-highlight');

          const targetEl = iframeDoc.elementFromPoint(coords.x, coords.y);
          if (targetEl) {
            targetEl.click();
            addLog(`🎯 클릭 완료: (${coords.x}px, ${coords.y}px)`);
          } else {
            addLog(`⚠️ 클릭 대상 없음`);
          }

          setTimeout(() => {
            if (pinEl) pinEl.classList.remove('active-highlight');
          }, 300);

        } else if (step.type === 'scroll') {
          const amount = step.direction === 'down' ? step.distance : -step.distance;
          iframeWin.scrollBy({ top: amount, behavior: 'smooth' });
          addLog(`📜 스크롤 완료 (${amount}px)`);
        }
      } catch (err) {
        addLog(`❌ CORS 오류: 타 도메인 접근 불가`);
        stopScenario();
      }
    }

    function stopScenario() {
      isRunning = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.querySelectorAll('.step-item').forEach(el => el.classList.remove('executing'));
      addLog('⏹ 매크로 중지됨');
    }

    function highlightStepUI(index) {
      const item = document.getElementById(`step_ui_${index}`);
      if (item) item.classList.add('executing');
    }

    function unhighlightStepUI(index) {
      const item = document.getElementById(`step_ui_${index}`);
      if (item) item.classList.remove('executing');
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function addLog(msg) {
      const logArea = document.getElementById('logArea');
      const time = new Date().toLocaleTimeString();
      logArea.innerText += `\n[${time}] ${msg}`;
      logArea.scrollTop = logArea.scrollHeight;
    }
  </script>
</body>
</html>
