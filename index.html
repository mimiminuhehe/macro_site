<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe 미리보기 & 조작 패널</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      background-color: #f4f6f8;
      overflow: hidden;
    }

    /* -----------------------------------
       왼쪽 영역: Iframe 및 URL 입력창
    ----------------------------------- */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e1e4e8;
      background-color: #ffffff;
    }

    .url-bar-container {
      padding: 12px 16px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #e1e4e8;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .url-input {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    .url-input:focus {
      border-color: #0969da;
    }

    .btn {
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      background-color: #0969da;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #0858b9;
    }

    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* -----------------------------------
       오른쪽 영역: 조작 패널
    ----------------------------------- */
    .right-panel {
      width: 320px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.03);
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      color: #24292f;
      border-bottom: 2px solid #f0f2f5;
      padding-bottom: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      font-size: 13px;
      font-weight: 600;
      color: #57606a;
    }

    .btn-secondary {
      padding: 8px 12px;
      font-size: 13px;
      background-color: #f6f8fa;
      color: #24292f;
      border: 1px solid rgba(27, 31, 36, 0.15);
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-secondary:hover {
      background-color: #f3f4f6;
    }

    .notice-box {
      font-size: 12px;
      color: #6e7781;
      background-color: #fff8c5;
      border: 1px solid rgba(212, 167, 44, 0.4);
      padding: 10px;
      border-radius: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- 왼쪽: 주소 입력창 + iframe -->
  <div class="left-panel">
    <div class="url-bar-container">
      <input 
        type="text" 
        id="urlInput" 
        class="url-input" 
        placeholder="https://example.com 형식으로 입력하세요" 
        value="https://example.com"
      >
      <button class="btn" onclick="loadUrl()">이동</button>
    </div>
    <div class="iframe-wrapper">
      <iframe id="siteIframe" src="https://example.com"></iframe>
    </div>
  </div>

  <!-- 오른쪽: 조작 패널 -->
  <div class="right-panel">
    <h2 class="panel-title">조작 패널</h2>

    <!-- 컨트롤 항목 예시 1: 새로고침 -->
    <div class="control-group">
      <span class="control-label">화면 제어</span>
      <button class="btn-secondary" onclick="reloadIframe()">iframe 새로고침</button>
    </div>

    <!-- 컨트롤 항목 예시 2: 너비 조절 -->
    <div class="control-group">
      <span class="control-label">미리보기 해상도</span>
      <button class="btn-secondary" onclick="setIframeWidth('100%')">전체 너비 (100%)</button>
      <button class="btn-secondary" onclick="setIframeWidth('375px')">모바일 크기 (375px)</button>
    </div>

    <!-- 안내 사항 -->
    <div class="notice-box">
      ⚠️ <strong>참고:</strong> Google, Naver 등 일부 사이트는 보안 정책(X-Frame-Options)으로 인해 iframe 내부 표출이 블록될 수 있습니다. 본인이 제작한 웹사이트나 오픈된 URL 테스트용으로 적합합니다.
    </div>
  </div>

  <script>
    // URL 이동 함수
    function loadUrl() {
      const input = document.getElementById('urlInput');
      let url = input.value.trim();

      if (!url) return;

      // http:// 나 https:// 가 없으면 자동으로 붙여줌
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
        input.value = url;
      }

      document.getElementById('siteIframe').src = url;
    }

    // 엔터키 입력 시 이동 처리
    document.getElementById('urlInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        loadUrl();
      }
    });

    // iframe 새로고침
    function reloadIframe() {
      const iframe = document.getElementById('siteIframe');
      iframe.src = iframe.src;
    }

    // iframe 너비 변경 예시
    function setIframeWidth(width) {
      const iframe = document.getElementById('siteIframe');
      iframe.style.width = width;
      iframe.style.margin = width === '100%' ? '0' : '0 auto';
    }
  </script>
</body>
</html>
